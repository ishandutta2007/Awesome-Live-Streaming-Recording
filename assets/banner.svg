<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Vibrant Gradient Accents -->
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .rec-pulse {
        animation: recPulse 1.8s infinite ease-in-out;
      }
      .wave-bar {
        transform-origin: bottom;
        animation: waveJump 1.2s infinite ease-in-out alternate;
      }
      .orbit-dot {
        animation: floatOrb 6s infinite ease-in-out alternate;
      }
      .stream-flow {
        stroke-dasharray: 8 6;
        animation: streamDash 20s linear infinite;
      }
      @keyframes recPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.88); }
      }
      @keyframes waveJump {
        0% { transform: scaleY(0.25); }
        100% { transform: scaleY(1); }
      }
      @keyframes floatOrb {
        0% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-12px) translateX(8px); }
        100% { transform: translateY(6px) translateX(-6px); }
      }
      @keyframes streamDash {
        to { stroke-dashoffset: -200; }
      }
      .font-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .font-sub {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        letter-spacing: 0.2px;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Subtle Dynamic Tech Grid / Network Lines (Background) -->
  <g opacity="0.18">
    <path d="M 0 90 L 1200 90 M 0 180 L 1200 180 M 0 270 L 1200 270" stroke="#38bdf8" stroke-width="1" />
    <path d="M 200 0 L 200 360 M 400 0 L 400 360 M 600 0 L 600 360 M 800 0 L 800 360 M 1000 0 L 1000 360" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 6" />
  </g>

  <!-- Ambient Light Orbs (Floating in Background) -->
  <circle cx="150" cy="80" r="130" fill="#38bdf8" opacity="0.08" filter="url(#glow)" class="orbit-dot" />
  <circle cx="1050" cy="280" r="140" fill="#ef4444" opacity="0.08" filter="url(#glow)" class="orbit-dot" />
  <circle cx="920" cy="90" r="110" fill="#818cf8" opacity="0.09" filter="url(#glow)" class="orbit-dot" />

  <!-- Animated Live Flow Line Connecting Nodes across Top/Back -->
  <path d="M 50 310 C 300 290, 450 330, 750 310 C 950 295, 1050 330, 1150 315" fill="none" stroke="url(#streamGrad)" stroke-width="2.5" opacity="0.6" class="stream-flow" />

  <!-- Dynamic Right-Side Visual: Live Audio / Video Equalizer & Broadcast Signal -->
  <g transform="translate(870, 75)">
    <!-- Broadcast Tower / Waves Card -->
    <rect width="260" height="210" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Mini Status Header -->
    <circle cx="30" cy="30" r="6" fill="#22c55e" filter="url(#subtleGlow)" />
    <text x="44" y="35" fill="#94a3b8" font-size="12" class="font-sub" font-weight="600">LIVE FEED • 60 FPS • 4K</text>
    
    <!-- Sound/Bitrate Audio Visualizer Bars (Animated) -->
    <g transform="translate(25, 160)">
      <rect class="wave-bar" style="animation-delay: 0.1s; animation-duration: 0.9s;" x="0" y="-80" width="8" height="80" rx="4" fill="#38bdf8" />
      <rect class="wave-bar" style="animation-delay: 0.3s; animation-duration: 1.3s;" x="14" y="-80" width="8" height="80" rx="4" fill="#38bdf8" />
      <rect class="wave-bar" style="animation-delay: 0.5s; animation-duration: 1.0s;" x="28" y="-80" width="8" height="80" rx="4" fill="#60a5fa" />
      <rect class="wave-bar" style="animation-delay: 0.2s; animation-duration: 1.4s;" x="42" y="-80" width="8" height="80" rx="4" fill="#818cf8" />
      <rect class="wave-bar" style="animation-delay: 0.6s; animation-duration: 1.1s;" x="56" y="-80" width="8" height="80" rx="4" fill="#a855f7" />
      <rect class="wave-bar" style="animation-delay: 0.4s; animation-duration: 0.8s;" x="70" y="-80" width="8" height="80" rx="4" fill="#c084fc" />
      <rect class="wave-bar" style="animation-delay: 0.7s; animation-duration: 1.2s;" x="84" y="-80" width="8" height="80" rx="4" fill="#e879f9" />
      <rect class="wave-bar" style="animation-delay: 0.15s; animation-duration: 1.5s;" x="98" y="-80" width="8" height="80" rx="4" fill="#f43f5e" />
      <rect class="wave-bar" style="animation-delay: 0.45s; animation-duration: 1.0s;" x="112" y="-80" width="8" height="80" rx="4" fill="#ef4444" />
      <rect class="wave-bar" style="animation-delay: 0.8s; animation-duration: 1.3s;" x="126" y="-80" width="8" height="80" rx="4" fill="#f87171" />
      <rect class="wave-bar" style="animation-delay: 0.25s; animation-duration: 0.9s;" x="140" y="-80" width="8" height="80" rx="4" fill="#fb923c" />
      <rect class="wave-bar" style="animation-delay: 0.65s; animation-duration: 1.1s;" x="154" y="-80" width="8" height="80" rx="4" fill="#facc15" />
      <rect class="wave-bar" style="animation-delay: 0.35s; animation-duration: 1.4s;" x="168" y="-80" width="8" height="80" rx="4" fill="#4ade80" />
      <rect class="wave-bar" style="animation-delay: 0.5s; animation-duration: 0.95s;" x="182" y="-80" width="8" height="80" rx="4" fill="#2dd4bf" />
      <rect class="wave-bar" style="animation-delay: 0.2s; animation-duration: 1.25s;" x="196" y="-80" width="8" height="80" rx="4" fill="#38bdf8" />
    </g>

    <!-- Signal Stats Row -->
    <text x="25" y="190" fill="#64748b" font-size="11" class="font-sub">PROTOCOL: SRT / RTMP / WebRTC</text>
  </g>

  <!-- Main Left Content (Foreground - guaranteed crisp visibility) -->
  <g transform="translate(80, 0)">
    
    <!-- Top Live Recording Badge -->
    <g transform="translate(0, 68)">
      <rect width="138" height="32" rx="16" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444" stroke-width="1.2" />
      <!-- Pulsing Red Dot -->
      <circle class="rec-pulse" cx="20" cy="16" r="6" fill="url(#redAccent)" filter="url(#subtleGlow)" />
      <text x="36" y="21" fill="#fca5a5" font-size="13" class="font-title" font-weight="700" letter-spacing="1.5">● REC LIVE</text>
      
      <!-- Secondary Spec Pill -->
      <rect x="148" y="0" width="132" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="#0284c7" stroke-width="1" />
      <text x="163" y="21" fill="#7dd3fc" font-size="12" class="font-title" font-weight="600">CURATED 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="156" fill="#ffffff" font-size="44" class="font-title">
      Awesome <tspan fill="url(#streamGrad)">Live Streaming</tspan>
    </text>
    <text x="0" y="206" fill="#f8fafc" font-size="44" class="font-title">
      &amp; Screen Recording
    </text>

    <!-- Subtitle & Ecosystem Highlights -->
    <text x="2" y="248" fill="#94a3b8" font-size="16" class="font-sub">
      The definitive index of professional SaaS studios &amp; high-performance open-source broadcast servers.
    </text>

    <!-- Technology Tags -->
    <g transform="translate(0, 274)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="94" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="17" fill="#cbd5e1" font-size="12" class="font-sub">OBS Studio</text>

      <!-- Tag 2 -->
      <rect x="104" y="0" width="84" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="118" y="17" fill="#cbd5e1" font-size="12" class="font-sub">MediaMTX</text>

      <!-- Tag 3 -->
      <rect x="198" y="0" width="80" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="212" y="17" fill="#cbd5e1" font-size="12" class="font-sub">Owncast</text>

      <!-- Tag 4 -->
      <rect x="288" y="0" width="80" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="303" y="17" fill="#cbd5e1" font-size="12" class="font-sub">FFmpeg</text>

      <!-- Tag 5 -->
      <rect x="378" y="0" width="96" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="391" y="17" fill="#cbd5e1" font-size="12" class="font-sub">Restreaming</text>

      <!-- Tag 6 -->
      <rect x="484" y="0" width="76" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="498" y="17" fill="#cbd5e1" font-size="12" class="font-sub">WebRTC</text>
    </g>
  </g>
</svg>